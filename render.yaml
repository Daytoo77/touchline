# Render Blueprint: ONE free Node web service that serves both the app and the match server.
# After deploy, open https://<service>.onrender.com on both phones: no Pages, no CORS, no extra variables.
services:
  - type: web
    name: touchline
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
